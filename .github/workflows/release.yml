name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# No user-controllable inputs from github.event.* are used in any `run:`
# block. The only expression interpolation is secrets.GITHUB_TOKEN, which
# is repository-controlled and passed via env, not into a shell.

permissions:
  contents: write  # needed by goreleaser to publish the release

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # goreleaser needs full history for changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
